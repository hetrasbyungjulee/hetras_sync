name: 판매량 RAW 연결 점검
on:
  push:
    paths:
      - '.github/workflows/raw-sync-check.yml'
      - 'check_raw_projection.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests gspread google-auth
      - name: 읽기 전용 연결 점검
        env:
          SELLMATE_CLIENT_ID: ${{ secrets.SELLMATE_CLIENT_ID }}
          SELLMATE_CLIENT_SECRET: ${{ secrets.SELLMATE_CLIENT_SECRET }}
          SELLMATE_DOMAIN: ${{ secrets.SELLMATE_DOMAIN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          import sync
          try:
              target = sync.get_google_client().open_by_key("1hGSFTLZxa9ObtDPdMtiCbxcU0GnTlsO9Xq3tMAQOuTQ")
              print("TARGET_ACCESS_OK")
          except PermissionError:
              print("TARGET_PERMISSION_REQUIRED")
          yesterday = datetime.now(ZoneInfo("Asia/Seoul")).date()-timedelta(days=1)
          session = sync.issue_external_token()
          orders,last_page = sync.get_sales_page(session,1,yesterday,yesterday)
          def shape(v,depth=0):
              if depth>4: return type(v).__name__
              if isinstance(v,dict): return {k:shape(x,depth+1) for k,x in v.items()}
              if isinstance(v,list): return [shape(v[0],depth+1)] if v else []
              return type(v).__name__
          if not orders: raise RuntimeError("No orders returned for yesterday")
          print("ORDER_SCHEMA",json.dumps(shape(orders[0]),ensure_ascii=False))
          print("ORDER_TYPES",json.dumps([{k:o.get(k) for k in ("type","order_type","status","order_status") if k in o} for o in orders[:3]],ensure_ascii=False))
          print("READ_ONLY_CHECK_OK")
          PY
          python -u check_raw_projection.py
