name: 판매량 RAW 연결 실패 재시도

on:
  workflow_run:
    workflows: ['판매량 RAW 자동 수집']
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 다른 실행 환경에서 실패 작업 재시도
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          repo=os.environ['REPOSITORY']
          run_id=int(os.environ['RUN_ID'])
          request=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
              data=b'', method='POST', headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response:
              if response.status!=201:
                  raise RuntimeError('Could not queue failed-job retry')
          print('실패 작업을 새 실행 환경에서 다시 시작했습니다. 최대 2회 재실행합니다.')
          PY
