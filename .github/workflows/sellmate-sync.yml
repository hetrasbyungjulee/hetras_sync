name: 셀메이트 자동 동기화

on:
  schedule:
    # 한국시간 오전 6시
    # UTC 기준 전날 21시
    - cron: '0 21 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: '강제 실행 여부'
        required: false
        default: 'false'

jobs:
  sync:

    runs-on: ubuntu-latest

    steps:

      - name: 코드 가져오기
        uses: actions/checkout@v4


      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: 패키지 설치
        run: |
          pip install requests gspread google-auth


      - name: 셀메이트 동기화 실행
        env:
          SELLMATE_ID: ${{ secrets.SELLMATE_ID }}
          SELLMATE_PW: ${{ secrets.SELLMATE_PW }}
          SELLMATE_DOMAIN: ${{ secrets.SELLMATE_DOMAIN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FORCE_SYNC: ${{ github.event.inputs.force }}

        run: python sync.py
